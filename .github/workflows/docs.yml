name: Deploy Docs

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - 'packages/**'
      - 'scripts/**'
      - 'docs-meta/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      packages_ready: ${{ steps.availability.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check public SDK packages
        id: availability
        run: |
          browser_version=$(node -p "require('./packages/stock-sdk/package.json').version")
          node_version=$(node -p "require('./packages/stock-node-sdk/package.json').version")
          check_url() {
            local url="$1"
            local status
            if ! status=$(curl --silent --show-error --location --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$url"); then
              echo "::error::Unable to check $url"
              exit 1
            fi
            case "$status" in
              200) return 0 ;;
              404) echo "::notice::Waiting for $url"; return 1 ;;
              *) echo "::error::HTTP $status from $url"; exit 1 ;;
            esac
          }

          attempts=1
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then attempts=6; fi
          for ((attempt=1; attempt<=attempts; attempt++)); do
            if check_url "https://registry.npmjs.org/stock-sdk/$browser_version" &&
               check_url "https://registry.npmjs.org/stock-node-sdk/$node_version" &&
               check_url "https://unpkg.com/stock-sdk@$browser_version/dist/index.js"; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ((attempt < attempts)); then sleep 10; fi
          done
          echo 'ready=false' >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.availability.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.availability.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Pages
        if: steps.availability.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Install dependencies
        if: steps.availability.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build with VitePress
        if: steps.availability.outputs.ready == 'true'
        run: pnpm build:pages
        env:
          GRAFANA_SOURCEMAP_TOKEN: ${{ secrets.GRAFANA_SOURCEMAP_TOKEN }}

      - name: Upload artifact
        if: steps.availability.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist

  deploy:
    if: needs.build.outputs.packages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
