name: Publish

# 通过 GitHub Actions + npm Trusted Publishing（OIDC）发布 Monorepo 发布包到 npm，
# 无需 NPM_TOKEN，鉴权与 provenance（来源证明绿勾）均由 OIDC 完成。
#
# 支持按 tag 独立发布两个发布包：
#   - v* 或 stock-sdk@*      → 发布 packages/stock-sdk
#   - stock-node-sdk@*       → 发布 packages/stock-node-sdk
#
# 首次发布新包须由 npm 维护者创建包，再为后续版本配置 Trusted Publisher。
# 现有包的 Trusted Publisher 配置：
#   - Organization or user: chengzuopeng
#   - Repository:           stock-sdk
#   - Workflow filename:    release.yml
#   - Environment:          （留空）

on:
  push:
    tags:
      - 'v*'
      - 'stock-sdk@*'
      - 'stock-node-sdk@*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'stock-sdk'
        type: choice
        options:
          - stock-sdk
          - stock-node-sdk

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build & test
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Resolve target package & verify version
        id: target
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: |
          EXPECTED_VER=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PKG="$RELEASE_PACKAGE"
          elif [[ "$GITHUB_REF_NAME" == stock-node-sdk@* ]]; then
            PKG="stock-node-sdk"
            EXPECTED_VER="${GITHUB_REF_NAME#stock-node-sdk@}"
          elif [[ "$GITHUB_REF_NAME" == stock-sdk@* ]]; then
            PKG="stock-sdk"
            EXPECTED_VER="${GITHUB_REF_NAME#stock-sdk@}"
          elif [[ "$GITHUB_REF_NAME" == v* ]]; then
            PKG="stock-sdk"
            EXPECTED_VER="${GITHUB_REF_NAME#v}"
          else
            echo "::error::Unsupported release tag format: $GITHUB_REF_NAME"
            exit 1
          fi
          case "$PKG" in
            stock-sdk|stock-node-sdk) ;;
            *) echo "::error::Unsupported package: $PKG"; exit 1 ;;
          esac
          ACTUAL_VER=$(node -p "require('./packages/${PKG}/package.json').version")
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$EXPECTED_VER" != "$ACTUAL_VER" ]; then
            echo "::error::Tag version (${EXPECTED_VER}) does not match packages/${PKG}/package.json version (${ACTUAL_VER})"
            exit 1
          fi
          echo "name=$PKG" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$PKG" >> "$GITHUB_OUTPUT"
          echo "Target package: ${PKG}@${ACTUAL_VER} (packages/$PKG)"

      - name: Pack and publish to npm
        env:
          RELEASE_PACKAGE: ${{ steps.target.outputs.name }}
          RELEASE_DIR: ${{ steps.target.outputs.dir }}
        run: |
          VERSION=$(node -p "require('./${RELEASE_DIR}/package.json').version")
          case "$VERSION" in
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=rc ;;
            *-alpha*) TAG=alpha ;;
            *-*)      TAG=next ;;
            *)        TAG=latest ;;
          esac
          echo "Publishing ${RELEASE_PACKAGE}@${VERSION} with dist-tag: ${TAG}"
          PACK_DIR=$(mktemp -d)
          pnpm --filter "$RELEASE_PACKAGE" pack --pack-destination "$PACK_DIR"
          npm publish "$PACK_DIR/${RELEASE_PACKAGE}-${VERSION}.tgz" --access public --tag "$TAG"
