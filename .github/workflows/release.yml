name: Publish

# 通过 GitHub Actions + npm Trusted Publishing（OIDC）发布 Monorepo 发布包到 npm，
# 无需 NPM_TOKEN，鉴权与 provenance（来源证明绿勾）均由 OIDC 完成。
#
# 支持按 tag 独立发布两个发布包：
#   - v* 或 stock-sdk@*      → 发布 packages/stock-sdk
#   - stock-node-sdk@*       → 发布 packages/stock-node-sdk
#
# 一次性准备（在 npmjs.com 上为每个包分别配置 Trusted Publisher）：
#   - Organization or user: chengzuopeng
#   - Repository:           stock-sdk
#   - Workflow filename:    release.yml
#   - Environment:          （留空）

on:
  push:
    tags:
      - 'v*'
      - 'stock-sdk@*'
      - 'stock-node-sdk@*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'stock-sdk'
        type: choice
        options:
          - stock-sdk
          - stock-node-sdk

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build & test
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Resolve target package & verify version
        id: target
        run: |
          EXPECTED_VER=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG="${{ inputs.package }}"
          elif [[ "${{ github.ref_name }}" == stock-node-sdk@* ]]; then
            PKG="stock-node-sdk"
            EXPECTED_VER="${{ github.ref_name#stock-node-sdk@ }}"
          elif [[ "${{ github.ref_name }}" == stock-sdk@* ]]; then
            PKG="stock-sdk"
            EXPECTED_VER="${{ github.ref_name#stock-sdk@ }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            PKG="stock-sdk"
            EXPECTED_VER="${{ github.ref_name#v }}"
          else
            echo "::error::Unsupported release tag format: ${{ github.ref_name }}"
            exit 1
          fi
          ACTUAL_VER=$(node -p "require('./packages/${PKG}/package.json').version")
          if [ -n "$EXPECTED_VER" ] && [ "$EXPECTED_VER" != "$ACTUAL_VER" ]; then
            echo "::error::Tag version (${EXPECTED_VER}) does not match packages/${PKG}/package.json version (${ACTUAL_VER})"
            exit 1
          fi
          echo "name=$PKG" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$PKG" >> "$GITHUB_OUTPUT"
          echo "Target package: ${PKG}@${ACTUAL_VER} (packages/$PKG)"

      - name: Publish to npm
        run: |
          PKG_DIR="${{ steps.target.outputs.dir }}"
          PKG_NAME="${{ steps.target.outputs.name }}"
          VERSION=$(node -p "require('./${PKG_DIR}/package.json').version")
          case "$VERSION" in
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=rc ;;
            *-alpha*) TAG=alpha ;;
            *-*)      TAG=next ;;
            *)        TAG=latest ;;
          esac
          echo "Publishing ${PKG_NAME}@${VERSION} with dist-tag: ${TAG}"
          pnpm --filter "$PKG_NAME" publish --access public --tag "$TAG" --no-git-checks
